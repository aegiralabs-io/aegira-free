[package]
name = "aegira"
version = "0.1.0"
edition = "2021"
authors = ["Aegira Labs"]
description = "A Linux automated incident detection and recovery engine"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
